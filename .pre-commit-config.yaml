# Run `pre-commit install` once; hooks then run on every commit.
# Refresh pins with `pre-commit autoupdate` (or let Renovate propose them).
default_language_version:
  python: python3
  # Node hooks (prettier, markdownlint) build on the current LTS release, never
  # on a pre-release that nodeenv would otherwise pick as the newest version.
  node: lts

# `pre-commit install` sets up both hook types: the file checks below and the
# commit-message check.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # nf-test writes snapshots without a trailing newline and rewrites them
        # verbatim on every `--update-snapshot`, so leave their bytes alone.
        exclude: '\.snap$'
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.yml"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yml"]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.0
    hooks:
      - id: typos

  # Commit messages follow Conventional Commits, which cliff.toml maps into the
  # changelog.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, refactor, chore, ci, test, perf, build, style, revert]

  # Nextflow syntax, type and deprecation checks, and the canonical Nextflow
  # format: the hook rewrites a file that is not formatted, which fails the run
  # until the change is staged. Both Nextflow hooks run through
  # .github/scripts/with-nextflow.sh, which picks the pixi environment's Nextflow
  # when .pixi provides one, otherwise the one on PATH, and stops before the hook
  # runs when that Nextflow is older than manifest.nextflowVersion.
  - repo: local
    hooks:
      - id: nextflow-lint
        name: nextflow lint
        entry: .github/scripts/with-nextflow.sh nextflow lint -o concise -format -spaces 4
        language: script
        files: '\.(nf|config)$'
        exclude: '^nf-test\.config$'

      # Every component, the stages nested in a scope included, against the
      # Nextflow module registry rules (.github/scripts/validate-components.sh).
      - id: nextflow-module-validate
        name: nextflow module validate
        entry: .github/scripts/with-nextflow.sh .github/scripts/validate-components.sh
        language: script
        pass_filenames: false
        files: '^((modules|subworkflows)/local/|\.github/scripts/validate-components\.sh$)'
