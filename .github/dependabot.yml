version: 2
updates:
  # GitHub Actions used in .github/workflows/ — grouped into one PR to cut noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Base image(s) in custom Dockerfiles (e.g. micromamba in containers/example).
  - package-ecosystem: docker
    directory: /containers/example
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
