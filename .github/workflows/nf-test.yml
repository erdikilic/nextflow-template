name: nf-test
# Correctness of the workflow wiring via the nf-test suite (stub-based, fast).
# NF-version coverage lives in nextflow-compatibility.yml, so this runs once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nf-test:
    name: nf-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # renovate: datasource=github-releases depName=prefix-dev/pixi
          pixi-version: "v0.84.1"
          locked: true
          cache: true

      # --ci fails on a missing snapshot instead of recording it, so every
      # snapshot must be committed.
      - name: Run nf-test
        run: pixi run nf-test test --ci --verbose --junitxml=nf-test-results.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nf-test-results
          path: nf-test-results.xml
          retention-days: 7
