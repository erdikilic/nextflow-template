name: lint
# pre-commit runs every linter, nextflow lint included, from the pixi toolchain.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # renovate: datasource=github-releases depName=prefix-dev/pixi
          pixi-version: "v0.84.1"
          locked: true
          cache: true

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pixi run pre-commit run --all-files --show-diff-on-failure
