name: functional
# Runs the workflow for real (containers + tools), not just -stub — catches
# broken container pulls, tool invocations, and output publishing. Runs once on
# the current NF; NF-version coverage lives in nextflow-compatibility.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: "26.04.6"
          java-version: "21"

      - name: Run workflow (test profile, docker)
        run: nextflow run . -profile test,docker --outdir results

      - name: Assert outputs exist
        run: |
          test -d results/example
          test -f results/reads/samplesheet.csv
          test -f results/workflow_info/collated_versions.yml
