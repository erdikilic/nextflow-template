name: functional
# Runs the workflow for real (containers + tools), not just -stub — catches
# broken container pulls, tool invocations, and output publishing. Runs on the
# pixi.lock pin, and only when workflow code, data or the toolchain change.
on:
  push:
    branches: [main]
    paths: &code
      - "**.nf"
      - "**.config"
      - "nextflow_schema.json"
      - "assets/**"
      - "bin/**"
      - "pixi.lock"
      - ".github/workflows/functional.yml"
  pull_request:
    branches: [main]
    paths: *code
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # renovate: datasource=github-releases depName=prefix-dev/pixi
          pixi-version: "v0.84.1"
          locked: true
          cache: true

      - name: Run workflow (test profile, docker)
        run: pixi run nextflow run . -profile test,docker --outdir results

      - name: Assert outputs exist
        run: |
          test -d results/example
          test -f results/reads/samplesheet.csv
          test -f results/qc/sequali/index.csv
          test -f results/workflow_info/collated_versions.yml
