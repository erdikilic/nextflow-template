name: functional test
# Runs the pipeline for real (containers + tools), not just -stub. This is the
# job that catches broken container pulls, tool invocations, and publishDir wiring.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    name: run (NF ${{ matrix.NXF_VER }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.04.0" # minimum supported (manifest nextflowVersion '>=26.04.0')
          - "26.04.6" # current pin
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow
        env:
          NXF_VER: ${{ matrix.NXF_VER }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://get.nextflow.io | bash
          mv nextflow "$HOME/.local/bin/nextflow"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pipeline (test profile, docker)
        run: nextflow run . -profile test,docker --outdir results

      - name: Assert outputs exist
        run: |
          test -d results/example
          test -f results/pipeline_info/collated_versions.yml
