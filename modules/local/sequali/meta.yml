---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nextflow-io/schemas/main/module/v1/schema.json
name: local/sequali
version: 1.0.0
kind: Process
description: Read quality metrics for a sample's long-read FASTQ, as an HTML report and JSON
keywords:
  - quality_control
  - qc
  - long-read
license: Apache-2.0
authors:
  - "@erdikilic"
maintainers:
  - "@erdikilic"
requires:
  nextflow: ">=26.10.4"
tools:
  - sequali:
      description: Fast sequencing quality metrics for short and long reads
      homepage: https://github.com/rhpvorderman/sequali
      documentation: https://sequali.readthedocs.io/en/latest/
      tool_dev_url: https://github.com/rhpvorderman/sequali
      doi: "10.5281/zenodo.10854010"
      licence: ["AGPL-3.0-or-later"]
      identifier: biotools:sequali
input:
  - - name: id
      type: string
      description: Sample identifier
    - name: fastq
      type: file
      description: Merged FASTQ for a single sample, plain or gzipped
      pattern: "*.{fastq,fq}{,.gz}"
      ontologies:
        - edam: http://edamontology.org/format_1930 # FASTQ
  - name: args
    type: string
    description: Extra Sequali command-line options (empty for none)
output:
  - - name: id
      type: string
      description: Sample identifier
    - name: html
      type: file
      description: Sequali HTML report
      pattern: "*.html"
      ontologies:
        - edam: http://edamontology.org/format_2331 # HTML
    - name: json
      type: file
      description: The report's metrics as JSON
      pattern: "*.json"
      ontologies:
        - edam: http://edamontology.org/format_3464 # JSON
topics:
  - - name: process
      type: string
      description: The process the version was collected from
    - name: tool
      type: string
      description: The tool name (sequali)
    - name: version
      type: string
      description: The tool version
