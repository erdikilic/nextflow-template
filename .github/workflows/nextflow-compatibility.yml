name: nextflow-compatibility
# Checks that the workflow parses and its wiring runs at both ends of the
# supported Nextflow range: the manifest floor and the newest release, edge
# included. The pixi.lock pin is covered by the nf-test and functional jobs.
# Uses config parsing + -stub (no containers pulled), so the matrix stays fast.
# Runs monthly, on demand, and on pull requests that touch Nextflow code.
on:
  schedule:
    - cron: "17 4 1 * *" # 1st of each month, 04:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.nf"
      - "**.config"
      - "nextflow_schema.json"
      - ".github/workflows/nextflow-compatibility.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compat:
    name: NF ${{ matrix.NXF_VER }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.10.4" # minimum supported (manifest nextflowVersion '>=26.10.4')
          - "latest-everything" # newest stable or edge release — early warning on upstream breaks
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nextflow ${{ matrix.NXF_VER }}
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}
          java-version: "25"

      - name: Parse config
        run: nextflow config . -profile test,docker >/dev/null

      - name: Run wiring (stub, no containers)
        run: nextflow run . -profile test,docker -stub --outdir results_stub
