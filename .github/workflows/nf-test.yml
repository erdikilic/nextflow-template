name: nf-test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  nf-test:
    name: nf-test (NF ${{ matrix.nextflow }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nextflow: ["26.04.6"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow + nf-test
        env:
          NXF_VER: ${{ matrix.nextflow }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://get.nextflow.io | bash
          mv nextflow "$HOME/.local/bin/nextflow"
          nftest_url="https://github.com/askimed/nf-test/releases/download/v0.9.5/nf-test-0.9.5.tar.gz"
          curl -fsSL "$nftest_url" | tar -xz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/"*
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run nf-test
        run: nf-test test --verbose
