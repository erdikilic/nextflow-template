---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nextflow-io/schemas/main/module/v1/schema.json
name: local/input/check
version: 1.0.0
kind: Workflow
description: Check long-read samplesheet rows and group a sample's FASTQs into one record
keywords:
  - samplesheet
  - validation
  - nanopore
  - pacbio
  - long-read
license: Apache-2.0
authors:
  - "@erdikilic"
maintainers:
  - "@erdikilic"
requires:
  nextflow: ">=26.10.6"
input:
  - name: rows
    type: channel
    description: |
      SamplesheetRow records (sample, platform, fastq), one per samplesheet row,
      as loaded from --input. The platform is null where the cell is empty or
      the column is absent.
  - name: platform
    type: string
    description: |
      Platform of a row whose platform cell is empty: ont_r9, ont_r10 or
      pacbio_hifi (from --platform). Any other value stops the run.
output:
  - name: samples
    type: channel
    description: |
      SampleReads records (id, platform, reads), one per sample, with every FASTQ
      of the sample in `reads`, sorted by file name.
