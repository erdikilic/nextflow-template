---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nextflow-io/schemas/main/module/v1/schema.json
name: local/handle_data
version: 1.0.0
kind: Process
description: Concatenate every FASTQ of a sample into one gzipped FASTQ
keywords:
  - fastq
  - merge
  - long-read
license: Apache-2.0
authors:
  - "@erdikilic"
maintainers:
  - "@erdikilic"
requires:
  nextflow: ">=26.10.4"
tools:
  - coreutils:
      description: GNU core utilities, the basic file, shell and text manipulation utilities
      homepage: https://www.gnu.org/software/coreutils/
      documentation: https://www.gnu.org/software/coreutils/manual/
      licence: ["GPL-3.0-or-later"]
input:
  - - name: id
      type: string
      description: Sample identifier
    - name: reads
      type: list
      description: Every FASTQ of the sample, plain or gzipped, in merge order
      pattern: "*.{fastq,fq}{,.gz}"
output:
  - - name: id
      type: string
      description: Sample identifier
    - name: fastq
      type: file
      description: The sample's reads merged into one gzipped FASTQ
      pattern: "*.merged.fastq.gz"
      ontologies:
        - edam: http://edamontology.org/format_1930 # FASTQ
topics:
  - - name: process
      type: string
      description: The process the version was collected from
    - name: tool
      type: string
      description: The tool name (coreutils)
    - name: version
      type: string
      description: The tool version
