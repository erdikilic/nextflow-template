# pixi.toml — reproducible developer toolchain for this template.
#
# It does not change how the workflow provisions software: Nextflow does that
# per process via the `container` / `conda` directives in modules/local/*/main.nf.
# pixi only pins the tools a contributor needs on their PATH.
#
#   pixi run setup    # install the git pre-commit hooks
#   pixi run lint     # all linters
#   pixi run test     # nf-test suite
#   pixi run stub     # wiring check, no tools executed
#   pixi task list    # everything else
#
# CI and the devcontainer install this toolchain from pixi.lock. Locally pixi is
# optional: the justfile recipes and the `[dependency-groups] dev` block in
# pyproject.toml work for contributors who provide the tools themselves.

[workspace]
name = "nextflow-template"
description = "Developer toolchain for the nextflow-template workflow"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]
requires-pixi = ">=0.78"

[dependencies]
# --- Nextflow runtime -------------------------------------------------------
# bioconda's nextflow package accepts openjdk >=17,<26. Java 25 is the current LTS;
# the java-version of .github/workflows/nextflow-compatibility.yml follows it.
openjdk = "25.*"
nf-test = "0.9.5.*"

# --- Launcher portability ---------------------------------------------------
# A launcher grown from run.sh typically needs bash >= 4 (associative arrays) and
# GNU realpath/nproc. macOS ships bash 3.2 and no nproc, so these two packages
# keep `pixi run launch` portable on osx-arm64.
bash = ">=5.2"
coreutils = ">=9.5"

# --- Linting / release tooling ----------------------------------------------
# pre-commit fetches its own hook binaries (prettier, markdownlint, yamllint,
# shellcheck, hadolint, actionlint, gitleaks) from the revs pinned in
# .pre-commit-config.yaml, so they are not repeated here.
python = "3.14.*"      # interpreter for pre-commit, nf-core and bin/ helpers
pre-commit = ">=4.6,<5"
nf-core = ">=4.0,<5"
# Pinned to the rev of the ruff-pre-commit hook, so `pixi run ruff` and
# `pixi run lint` apply the same rules.
ruff = "0.17.3.*"
just = ">=1.59"        # task runner behind the justfile recipes

[activation.env]
# `nextflow lint` walks the whole tree, and an in-tree environment (.pixi/,
# .venv/) holds nf-core's Jinja templates, which are not valid Nextflow. Passing
# -exclude replaces the built-in default list, so the defaults are restated here.
NF_LINT_EXCLUDE = "-exclude .git -exclude .lineage -exclude .nextflow -exclude .nf-test -exclude nf-test.config -exclude work -exclude .pixi -exclude .venv"

[tasks]
setup = { cmd = "pre-commit install", description = "Install the git pre-commit hooks" }
lint = { cmd = "pre-commit run --all-files", description = "Run all pre-commit linters" }
nf-lint = { cmd = "nextflow lint -o concise $NF_LINT_EXCLUDE .", description = "Lint Nextflow (.nf/.config) for errors + deprecations" }
format = { cmd = "pre-commit run prettier --all-files || true; pre-commit run ruff-format --all-files || true", description = "Auto-format (prettier + ruff)" }
module-validate = { cmd = "bash -c 'for d in */local/*/; do nextflow module validate \"./${d%/}\" || exit 1; done'", description = "Check every module against the Nextflow module registry rules" }
nf-format = { cmd = "nextflow lint -format -spaces 4 $NF_LINT_EXCLUDE .", description = "Auto-format Nextflow to canonical style" }
test = { cmd = "nf-test test", description = "Run the nf-test suite" }
run = { cmd = "nextflow run . -profile test,docker --outdir results", description = "Run the minimal test end-to-end (docker)" }
stub = { cmd = "nextflow run . -profile test,docker -stub --outdir results_stub", description = "Validate wiring without running tools" }
# The real-data entry point; the task name is the same in every workflow built
# from this template:  pixi run launch --input samplesheet.csv --outdir results
#
# The task is a single command: pixi appends trailing arguments to the end of the
# task string, so in a chain (`&&`, `;`) they would reach the last command only.
#
# Workflow parameters belong to run.sh and run.env; pixi contributes the
# toolchain only, so a run's settings come from one place.
launch = { cmd = "bash run.sh", description = "Run the workflow on real data via run.sh (arguments are forwarded)" }
config = { cmd = "nextflow config . -profile test > /dev/null && echo 'config OK'", description = "Parse config / catch syntax errors" }
update = { cmd = "pre-commit autoupdate", description = "Bump pre-commit hook / linter pins to their latest releases" }
clean = { cmd = "rm -rf work results results_* .nextflow* .nf-test .nf-test.log .lineage", description = "Remove run artefacts" }

# Nextflow lives in a feature rather than [dependencies] so the version can be
# swapped per environment without the two pins colliding.
[feature.nf-pin.dependencies]
# The lint, nf-test and functional CI jobs run this pin from pixi.lock.
nextflow = "26.10.6.*"

[feature.nf-min.dependencies]
# The floor declared by manifest.nextflowVersion in nextflow.config.
nextflow = "26.10.6.*"

# Container engines: pixi can supply Apptainer, but not Docker (a daemon, not a
# conda package). On a Docker workstation the engine still comes from the host.
[feature.hpc]
platforms = ["linux-64"]   # apptainer has no osx-arm64 build

[feature.hpc.dependencies]
apptainer = ">=1.5"

[environments]
default = ["nf-pin"]
# Reproduce the CI minimum-version job locally:  pixi run -e nf-min stub
nf-min = { features = ["nf-min"], no-default-feature = false }
# Clusters without a usable Apptainer:
#   PROFILE=apptainer pixi run -e hpc launch --input samplesheet.csv
# The profile is a run setting (PROFILE, as in run.env), so this environment
# adds the engine and leaves the profile to the caller.
hpc = ["nf-pin", "hpc"]
