---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nextflow-io/schemas/main/module/v1/schema.json
name: local/example
version: 1.0.0
kind: Process
description: Count the lines in a sample's reads as a placeholder for a real tool
keywords:
  - example
  - placeholder
  - template
license: Apache-2.0
authors:
  - "@erdikilic"
maintainers:
  - "@erdikilic"
requires:
  nextflow: ">=26.10.4"
tools:
  - coreutils:
      description: GNU core utilities, the basic file, shell and text manipulation utilities
      homepage: https://www.gnu.org/software/coreutils/
      documentation: https://www.gnu.org/software/coreutils/manual/
      licence: ["GPL-3.0-or-later"]
input:
  - - name: id
      type: string
      description: Sample identifier
    - name: fastq
      type: file
      description: Merged FASTQ for a single sample, plain or gzipped
      pattern: "*.{fastq,fq}{,.gz}"
      ontologies:
        - edam: http://edamontology.org/format_1930 # FASTQ
output:
  - - name: id
      type: string
      description: Sample identifier
    - name: counts
      type: file
      description: Number of lines in the sample's reads
      pattern: "*.linecount.txt"
topics:
  - - name: process
      type: string
      description: The process the version was collected from
    - name: tool
      type: string
      description: The tool name (coreutils)
    - name: version
      type: string
      description: The tool version
