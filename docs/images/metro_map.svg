<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">nextflow-template metro map</title>
  <desc id="desc">A samplesheet passes through INPUT_CHECK and HANDLE_DATA, then splits into Sequali read QC and the EXAMPLE stage; merged reads, QC reports, example output and tool versions are published.</desc>
  <rect x="0" y="0" width="960" height="330" rx="16" fill="#ffffff"/>

  <!-- Lines -->
  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- QC line: branches after HANDLE_DATA -->
    <path d="M 400 165 H 470 C 520 165 520 85 570 85 H 820" stroke="#2da44e"/>
    <!-- Example line: branches after HANDLE_DATA -->
    <path d="M 400 165 H 470 C 520 165 520 245 570 245 H 820" stroke="#d4760a"/>
    <!-- Reads line, drawn last so the shared trunk shows its colour -->
    <path d="M 70 165 H 820" stroke="#1f6feb"/>
  </g>

  <!-- Stations -->
  <g fill="#ffffff" stroke="#24292f" stroke-width="4">
    <circle cx="70" cy="165" r="13"/>
    <circle cx="230" cy="165" r="13"/>
    <circle cx="400" cy="165" r="13"/>
    <circle cx="660" cy="85" r="13"/>
    <circle cx="660" cy="245" r="13"/>
  </g>

  <!-- Terminals: published outputs -->
  <g fill="#24292f">
    <rect x="808" y="153" width="24" height="24" rx="4"/>
    <rect x="808" y="73" width="24" height="24" rx="4"/>
    <rect x="808" y="233" width="24" height="24" rx="4"/>
  </g>

  <!-- Station labels -->
  <g fill="#24292f" font-size="16" text-anchor="middle">
    <text x="70" y="205">samplesheet</text>
    <text x="70" y="224" font-size="13" fill="#57606a">--input</text>
    <text x="230" y="205" font-weight="bold">INPUT_CHECK</text>
    <text x="230" y="224" font-size="13" fill="#57606a">check rows, group per sample</text>
    <text x="400" y="205" font-weight="bold">HANDLE_DATA</text>
    <text x="400" y="224" font-size="13" fill="#57606a">merge FASTQs</text>
    <text x="660" y="60" font-weight="bold">SEQUALI</text>
    <text x="660" y="120" font-size="13" fill="#57606a">read QC</text>
    <text x="660" y="285" font-weight="bold">EXAMPLE</text>
    <text x="660" y="304" font-size="13" fill="#57606a">replace with your tools</text>
  </g>

  <!-- Output labels -->
  <g fill="#24292f" font-size="15" text-anchor="start">
    <text x="846" y="90">qc/sequali/</text>
    <text x="846" y="170">reads/</text>
    <text x="846" y="250">example/</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#57606a">
    <text x="24" y="30">workflow_info/versions.yml collects the version of every tool that ran</text>
  </g>
</svg>
