---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: handle_data
description: Concatenate every long-read FASTQ belonging to a sample into one gzipped FASTQ
keywords:
  - fastq
  - concatenate
  - nanopore
  - pacbio
  - long reads
tools:
  - coreutils:
      description: GNU core utilities, the basic file, shell and text manipulation utilities
      homepage: https://www.gnu.org/software/coreutils/
      documentation: https://www.gnu.org/software/coreutils/manual/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', platform:'nanopore' ]`
    - reads:
        type: file
        description: One or more FASTQ files belonging to a single sample, plain or gzipped
        pattern: "*.{fastq,fq}{,.gz}"
        ontologies: []
output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', platform:'nanopore' ]`
      - "*.merged.fastq.gz":
          type: file
          description: All of the sample's reads concatenated into a single gzipped FASTQ
          pattern: "*.merged.fastq.gz"
          ontologies: []
  versions_coreutils:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - coreutils:
          type: string
          description: The tool name
      - wc --version | head -n1 | sed "s/^.* //":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - coreutils:
          type: string
          description: The tool name
      - wc --version | head -n1 | sed "s/^.* //":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@erdikilic"
maintainers:
  - "@erdikilic"
